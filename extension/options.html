<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>译页设置</title>
  <link rel="stylesheet" href="options.css">
  <link rel="stylesheet" href="api-test.css">
  <link rel="stylesheet" href="component-mode.css">
</head>
<body>
  <main>
    <aside>
      <span class="seal">译</span>
      <p>YÌ YÈ / 01</p>
      <h1>把翻译留在文字里，<br>把网页留在原处。</h1>
    </aside>
    <section>
      <header>
        <p class="kicker">DEEPSEEK CONNECTION</p>
        <h2>翻译设置</h2>
      </header>
      <form id="settingsForm">
        <label>API Key<input id="apiKey" type="password" autocomplete="off" placeholder="sk-…"></label>
        <label>API Base URL<input id="apiBaseUrl" type="url" required></label>
        <label>模型名称<input id="model" type="text" required></label>
        <div class="row">
          <label>单次最大字符数<input id="maxCharacters" type="number" min="1000" max="30000" step="500"></label>
          <label>并发请求数<input id="concurrency" type="number" min="1" max="5"></label>
        </div>
        <label class="component-option">
          <span>
            <strong>翻译页面组件</strong>
            <small>默认开启。翻译作者标签、状态、标签页和常见短文本，同时跳过人名、比分和代码。</small>
          </span>
          <input id="translateComponents" type="checkbox">
          <i aria-hidden="true"></i>
        </label>
        <label class="component-option">
          <span>
            <strong>翻译导航栏（实验）</strong>
            <small>默认关闭。开启后翻译菜单和导航链接；部分网站可能因中文更长而出现布局拥挤。</small>
          </span>
          <input id="translateNavigation" type="checkbox">
          <i aria-hidden="true"></i>
        </label>
        <div class="actions">
          <button class="save" type="submit">保存设置</button>
          <button id="testApi" class="test-api" type="button">测试 API 连接</button>
          <button id="clearCache" type="button">清空翻译缓存</button>
          <span id="message" role="status"></span>
        </div>
        <div id="testResult" class="test-result" role="status" aria-live="polite" hidden>
          <span class="test-indicator" aria-hidden="true"></span>
          <div>
            <strong id="testTitle"></strong>
            <p id="testDetail"></p>
          </div>
        </div>
      </form>
      <div class="notice">
        <strong>隐私提示</strong>
        <p>翻译时，识别到的网页正文和启用的组件文字会发送给你配置的 API 服务。API Key 仅保存在浏览器本地存储中。</p>
      </div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
