<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>译页设置</title>
  <link rel="stylesheet" href="options.css">
  <link rel="stylesheet" href="api-test.css">
  <link rel="stylesheet" href="component-mode.css">
</head>
<body>
  <main>
    <aside>
      <div class="aside-brand">
        <span class="seal">译</span>
        <div>
          <strong>译页</strong>
          <p>PAGE TRANSLATOR</p>
        </div>
      </div>
      <div class="aside-copy">
        <span class="edition">SYSTEM / 01</span>
        <h1>翻译文字，<br>不打扰网页。</h1>
        <p class="aside-note">参数仅保存在当前浏览器中。</p>
      </div>
      <div class="signal" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </aside>
    <section class="settings-panel">
      <header>
        <div>
          <p class="kicker">PREFERENCES</p>
          <h2>翻译设置</h2>
        </div>
        <span class="local-badge"><i></i>LOCAL ONLY</span>
      </header>
      <form id="settingsForm">
        <fieldset>
          <legend><span>01</span>API 连接</legend>
          <div class="field-grid">
            <label class="full">API Key<input id="apiKey" type="password" autocomplete="off" placeholder="sk-…"></label>
            <label>API Base URL<input id="apiBaseUrl" type="url" required></label>
            <label>模型名称<input id="model" type="text" required></label>
          </div>
        </fieldset>
        <fieldset>
          <legend><span>02</span>处理性能</legend>
          <div class="row">
            <label>单批字符上限<input id="maxCharacters" type="number" min="1000" max="1200" step="100"></label>
            <label>最大在途请求数<input id="concurrency" type="number" min="1" max="500"></label>
          </div>
        </fieldset>
        <fieldset>
          <legend><span>03</span>翻译范围</legend>
          <p>自动翻译正文、导航、按钮、侧栏和页脚中的全部可见英文文字。代码、输入内容、隐藏区域、网址和广告不会发送翻译。</p>
        </fieldset>
        <div class="actions">
          <button class="save" type="submit">保存设置</button>
          <button id="testApi" class="test-api" type="button">测试 API 连接</button>
          <button id="clearCache" type="button">清空翻译缓存</button>
          <span id="message" role="status"></span>
        </div>
        <div id="testResult" class="test-result" role="status" aria-live="polite" hidden>
          <span class="test-indicator" aria-hidden="true"></span>
          <div>
            <strong id="testTitle"></strong>
            <p id="testDetail"></p>
          </div>
        </div>
      </form>
      <div class="notice">
        <span class="notice-icon" aria-hidden="true">i</span>
        <div>
          <strong>数据与隐私</strong>
          <p>翻译时，识别到的网页文字会发送给你配置的 API 服务。API Key 仅保存在浏览器本地。</p>
        </div>
      </div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
